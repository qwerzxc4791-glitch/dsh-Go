name: Build and Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: ./app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取仓库源码
        uses: actions/checkout@v4

      - name: 2. 安装 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 安装 Flutter 打包工具
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. 下载项目依赖包
        run: flutter pub get

      - name: 5. 编译生成免签名 APK
        run: flutter build apk --debug # 改成 debug 版，彻底绕开签名密钥报错

      - name: 6. 自动上架到永久 Releases 货架
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 云端自动打包版 v1.0.${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-debug.apk # 抓取生成的 debug 安装包
